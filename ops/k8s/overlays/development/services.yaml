apiVersion: v1
kind: Service
metadata:
  name: keycloak-loadbalancer
  namespace: keycloak
spec:
  selector:
    app: keycloak
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: keycloak-http
    - name: https
      protocol: TCP
      port: 8443
      targetPort: keycloak-https
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-loadbalancer
  namespace: keycloak
spec:
  selector:
    app: grafana
  type: LoadBalancer
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-loadbalancer
  namespace: keycloak
spec:
  selector:
    app: prometheus
  type: LoadBalancer
  ports:
    - name: web
      protocol: TCP
      port: 9090
      targetPort: 9090
