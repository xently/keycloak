apiVersion: v1
kind: Service
metadata:
  name: keycloak-metrics
  namespace: keycloak
  labels:
    app: keycloak
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: metrics
      port: 9000
      targetPort: keycloak-mgmt
