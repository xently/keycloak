apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-configmap
  namespace: keycloak
  labels:
    grafana_dashboard: "1"
data:
  keycloak-dashboard.json: |
    {
      "__inputs": [
        {
          "name": "DS_LOKI",
          "label": "Loki",
          "description": "",
          "type": "datasource",
          "pluginId": "loki",
          "pluginName": "Loki"
        }
      ],
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "panels": [
        {
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "id": 4,
          "title": "Uptime",
          "type": "stat",
          "targets": [
            {
              "expr": "time() - process_start_time_seconds{job=\"kubernetes-pods\", app=\"keycloak\", instance=~\"$instance\"}",
              "legendFormat": "uptime"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "description": "Shows the uptime of the Keycloak process."
        },
        {
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "id": 12,
          "title": "Active Sessions",
          "type": "gauge",
          "targets": [
            {
              "expr": "sum(keycloak_sessions{realm=~\".*\", instance=~\"$instance\"})",
              "legendFormat": "sessions"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "description": "Total number of active user sessions across all realms."
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 2,
          "title": "Request Rate",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{app=\"keycloak\", instance=~\"$instance\"}[5m]))",
              "legendFormat": "req/s"
            }
          ],
          "description": "The number of requests per second.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          }
        },
        {
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 6,
          "title": "Response Time P95",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{app=\"keycloak\", instance=~\"$instance\"}[5m])) by (le))",
              "legendFormat": "p95"
            }
          ],
          "description": "95th percentile of request response times.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            }
          }
        },
        {
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "id": 8,
          "title": "JVM Memory Used",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(jvm_memory_used_bytes{app=\"keycloak\", area=~\"heap|nonheap\", instance=~\"$instance\"}) by (area)",
              "legendFormat": "{{area}}"
            }
          ],
          "description": "JVM memory usage, separated by heap and non-heap areas.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          }
        },
        {
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 24 },
          "id": 14,
          "title": "Keycloak Logs",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "${DS_LOKI}"
          },
          "targets": [
            {
              "expr": "{namespace=\"keycloak\", app=\"keycloak\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showLabels": true,
            "showTime": true,
            "enableLogDetails": true,
            "dedupStrategy": "none"
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["keycloak"],
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "All",
              "value": "$__all"
            },
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "instance",
            "options": [],
            "query": "label_values(up{app=\"keycloak\"}, instance)",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "sort": 0,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "Keycloak Overview",
      "uid": "keycloak-overview",
      "version": 2
    }
