apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: keycloak
  labels:
    app: postgres-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - name: http
      port: 9187
      targetPort: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: keycloak
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: "keycloak-database.keycloak.svc.cluster.local:5432/authentication?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom: { secretKeyRef: { name: keycloak-credentials, key: DB_USERNAME } }
            - name: DATA_SOURCE_PASS
              valueFrom: { secretKeyRef: { name: keycloak-credentials, key: DB_PASSWORD } }
          args:
            - "--web.listen-address=:9187"
            - "--log.level=info"
